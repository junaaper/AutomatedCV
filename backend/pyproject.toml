[project]
name = "automatedcv-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the AutomatedCV job-application copilot"
authors = [
    { name = "junaaper", email = "junaidamalik01@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Sample CV/posting text: line breaks are content, not code style.
"app/demo/content.py" = ["E501"]
"evals/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
]
