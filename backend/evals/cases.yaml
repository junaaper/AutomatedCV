# Eval cases. Every posting is scored against the demo persona CV (app/demo/content.py:
# Sam Rivera: ~5 yrs Python/FastAPI/PostgreSQL/Redis backend, React/TypeScript, Node.js,
# AWS/Terraform, CI, mentoring, payments domain).
#
# expect.must_have: keyword groups; a group is "recalled" if any alternative appears
#   (case-insensitive substring) in any extracted requirement.
# expect.score: inclusive [min, max] band for the fit score.
# expect.absent: skills the CV does NOT have; the letter must not claim them (mentioning
#   them only as a gap / willingness to learn is fine).

- id: backend-python-fintech
  posting: |
    Senior Python Engineer, Payments
    Company: Cobalt Ledger · Remote (UK)

    Cobalt Ledger reconciles payments for 5,000 marketplaces. You'll join the core ledger team.

    Requirements:
    - 5+ years of backend engineering
    - Python with FastAPI or Flask
    - PostgreSQL performance tuning
    - Message queues or event streaming (Redis, Kafka, RabbitMQ)
    - Strong testing culture and CI/CD

    Nice to have:
    - Payments or accounting systems experience
    - AWS
  expect:
    company: Cobalt Ledger
    title: Python
    must_have: [["python", "fastapi", "flask"], ["postgres"], ["queue", "event", "kafka", "redis", "stream"], ["test", "ci"]]
    score: [70, 100]
    absent: [Kafka, RabbitMQ]

